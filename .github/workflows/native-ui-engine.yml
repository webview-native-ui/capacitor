name: Native UI Engine
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  swift:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node --test scripts/retry-dependency-download.test.mjs
      - run: bash scripts/verify-engine-spm.sh
      - name: Verify npm-distributed CocoaPods library
        run: |
          CAPACITOR_IOS_VERSION=$(node -p "require('./package.json').devDependencies['@capacitor/ios']")
          npm install --prefix "$RUNNER_TEMP/engine-pods-deps" --ignore-scripts --no-package-lock "@capacitor/ios@$CAPACITOR_IOS_VERSION"
          bash scripts/verify-engine-pods.sh "$RUNNER_TEMP/engine-pods-deps/node_modules/@capacitor/ios"
      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Resolve Swift dependencies before testing
        run: |
          xcodegen generate --spec ios/Tests/project.yml
          bash scripts/retry-dependency-download.sh xcodebuild -resolvePackageDependencies -scheme RdlaboCapacitorNativeUi-Package -clonedSourcePackagesDirPath "$RUNNER_TEMP/native-ui-spm"
          bash scripts/retry-dependency-download.sh xcodebuild -resolvePackageDependencies -project ios/Tests/NativeUIHostedTests.xcodeproj -scheme NativeUIHostedTests -clonedSourcePackagesDirPath "$RUNNER_TEMP/native-ui-spm"
      - name: Test on an available iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          # SwiftUI presentations require an application event loop on iOS 26.
          POPOVER_CLOSE=NativeUIPluginTests/NativeUISnapshotTests/testNativePopoverClosureNotifiesWebBeforeReopening
          POPOVER_REPLACE=NativeUIPluginTests/NativeUISnapshotTests/testPopoverReopensAfterPresentationIdentityKeepsReplacedSource
          COVERED_ORIENTATION=NativeUIPluginTests/NativeUIPluginLifecycleTests/testOrientationPreservesCoveredControlsUntilRestore
          CAPTURE_INTERACTION=NativeUIPluginTests/NativeUIPluginLifecycleTests/testSnapshotInteractionForwardsEnginePayloadToCapacitor
          xcodebuild -scheme RdlaboCapacitorNativeUi-Package -destination "platform=iOS Simulator,id=$DEVICE" CODE_SIGNING_ALLOWED=NO -clonedSourcePackagesDirPath "$RUNNER_TEMP/native-ui-spm" -skip-testing:"$POPOVER_CLOSE" -skip-testing:"$POPOVER_REPLACE" -skip-testing:"$COVERED_ORIENTATION" -skip-testing:"$CAPTURE_INTERACTION" test
          cd ios/Tests
          xcodebuild -project NativeUIHostedTests.xcodeproj -scheme NativeUIHostedTests -destination "platform=iOS Simulator,id=$DEVICE" CODE_SIGNING_ALLOWED=NO -clonedSourcePackagesDirPath "$RUNNER_TEMP/native-ui-spm" -only-testing:"$POPOVER_CLOSE" -only-testing:"$POPOVER_REPLACE" -only-testing:"$COVERED_ORIENTATION" -only-testing:"$CAPTURE_INTERACTION" test
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download Gradle distribution before testing
        run: bash scripts/retry-dependency-download.sh ./android/gradlew --version
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Android library and real Capacitor consumer
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: sh scripts/verify-native-ui-engine-android.sh emulator-5554
