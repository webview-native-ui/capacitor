name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    concurrency:
      group: npm-capacitor-release
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Validate release version
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const version = process.env.GITHUB_REF_NAME.replace(/^v/, '');
          assert.match(version, /^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/);
          assert.equal(JSON.parse(readFileSync('package.json')).version, version);
          JS
      - run: npm run build
      - run: npm test
      - run: npm run test:esm
      - name: Verify Engine native dependency
        run: sh scripts/verify-engine-maven.sh "$(node -p "require('./package.json').dependencies['@webview-native-ui/engine']")"
      - name: Publish plugin
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          case "$VERSION" in *-*) DIST_TAG=next ;; *) DIST_TAG=latest ;; esac
          npm publish --ignore-scripts --provenance --access public --tag "$DIST_TAG"
